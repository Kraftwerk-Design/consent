<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/e2e/site/_recorder.js"></script>
    <title>Age gate</title>
    <link rel="stylesheet" href="/node_modules/vanilla-cookieconsent/dist/cookieconsent.css" />
<!-- age-gate-head -->
<script>
  if (document.cookie.split(/;\s*/).includes("e2e_age_verified=1"))
    document.documentElement.classList.add("age-verified")
</script>
<!-- /age-gate-head -->
    <style>
      .age-verified #age-gate {
        display: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "vanilla-cookieconsent": "/node_modules/vanilla-cookieconsent/dist/cookieconsent.esm.js",
          "@kraftwerkdesign/consent": "/dist/index.js"
        }
      }
    </script>
    <script type="text/plain" data-category="necessary">
      __rec.ran('necessary')
    </script>
    <script type="text/plain" data-category="analytics">
      __rec.ran('analytics')
    </script>
    <script
      type="text/plain"
      data-category="analytics"
      src="https://www.googletagmanager.com/gtag/js?id=G-TEST"
    ></script>
    <script type="module">
      import { initConsent, confirmAge, googleConsentMode } from '@kraftwerkdesign/consent'
      const optOut = new URLSearchParams(location.search).get('mode') === 'opt-out'
      window.consentReady = initConsent({
        cookieName: 'e2e_consent',
        ...(optOut && {
          mode: 'opt-out',
          categories: [
            { id: 'necessary', enabled: true, readOnly: true },
            { id: 'analytics', enabled: true },
          ],
        }),
        integrations: [
          googleConsentMode({
            security_storage: 'necessary',
            functionality_storage: 'necessary',
            analytics_storage: 'analytics',
            ad_storage: 'analytics',
            ad_user_data: 'analytics',
            ad_personalization: 'analytics',
          }),
        ],
        ageGate: { cookieName: 'e2e_age_verified' },
      }).ready
      document.querySelector('#age-yes').addEventListener('click', () => {
        confirmAge()
        document.documentElement.classList.add('age-verified')
      })
    </script>
  </head>
  <body>
    <div id="age-gate">
      <p>Are you of legal drinking age?</p>
      <button id="age-yes">Yes</button>
    </div>
    <script>
      window.gateShownAtParse =
        getComputedStyle(document.querySelector('#age-gate')).display !== 'none'
    </script>
    <h1>Age gate</h1>
    <a id="gated" href="#next" data-require-consent="analytics">Open in maps</a>
    <consent-embed id="map" category="analytics" autoactivate>
      <button data-poster>Show map</button>
      <template><iframe title="map" src="about:blank"></iframe></template>
    </consent-embed>
  </body>
</html>
