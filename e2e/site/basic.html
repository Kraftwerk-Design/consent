<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/e2e/site/_recorder.js"></script>
    <title>Basic</title>
    <link rel="stylesheet" href="/node_modules/vanilla-cookieconsent/dist/cookieconsent.css" />
    <script type="importmap">
      {
        "imports": {
          "vanilla-cookieconsent": "/node_modules/vanilla-cookieconsent/dist/cookieconsent.esm.js",
          "@kraftwerkdesign/consent": "/dist/index.js"
        }
      }
    </script>
    <script type="text/plain" data-category="analytics">
      __rec.ran('analytics')
    </script>
    <script type="module">
      import { initConsent } from '@kraftwerkdesign/consent'
      const params = new URLSearchParams(location.search)
      const reload = params.get('reload')
      window.consentReady = initConsent({
        cookieName: 'e2e_consent',
        ...(reload && { reload }),
        ...(params.has('gpcOverride') && { allowGpcOverride: true }),
      }).ready
    </script>
  </head>
  <body>
    <h1>Basic</h1>
    <a id="gated" href="#next" data-require-consent="analytics">Open in maps</a>
    <button id="page-accept-all" data-cc="accept-all">Accept all</button>
  </body>
</html>
